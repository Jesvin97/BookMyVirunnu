name: DevSecOps Pipeline - Reporting Mode

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: write
  security-events: write
  actions: read
  issues: write
  pull-requests: write
  pages: write
  id-token: write

env:
  NODE_VERSION: 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  ##############################################################################
  # Job 1 - Security Scan (NON-BLOCKING)
  ##############################################################################
  security-scan:
    name: Security Scan (SCA & Secrets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        continue-on-error: true

      - name: Dependency Audit
        id: npm-audit
        continue-on-error: true
        run: |
          npm audit --workspaces --audit-level=high --json > npm-audit.json 2>&1 || true
          if [ -f npm-audit.json ]; then
            echo "Audit completed"
            cat npm-audit.json
          fi

      - name: Trivy Filesystem Scan (JSON)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0
          format: json
          output: trivy-fs-results.json

      - name: Trivy Filesystem Scan (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL,MEDIUM
          exit-code: 0
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITLEAKS_ENABLE_SUMMARY: true

      - name: TruffleHog Scan
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:latest \
            filesystem /repo \
            --json \
            --no-verification > trufflehog-results.json 2>&1 || true

      - name: Install License Checker
        run: npm install -g license-checker

      - name: Check Licenses
        continue-on-error: true
        run: |
          license-checker --json > licenses.json 2>&1 || true
          license-checker --summary

      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json

      - name: AI Security Checks
        continue-on-error: true
        run: |
          mkdir -p reports
          echo "# AI Security Scan Report" > ai-security-report.md
          echo "" >> ai-security-report.md
          echo "**Scan Date**: $(date -u)" >> ai-security-report.md
          echo "" >> ai-security-report.md
          
          # Check for hardcoded API keys
          echo "## API Key Detection" >> ai-security-report.md
          if grep -rE "(sk-[a-zA-Z0-9]{48}|sk-proj-[a-zA-Z0-9_-]{48,}|anthropic_[a-zA-Z0-9]{40})" src/ apps/ packages/ 2>/dev/null; then
            echo "⚠️ **WARNING**: Potential API keys found in source code!" >> ai-security-report.md
          else
            echo "✅ No hardcoded API keys detected" >> ai-security-report.md
          fi
          
          echo "" >> ai-security-report.md
          echo "## Environment Variables" >> ai-security-report.md
          for var in OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_API_KEY; do
            if grep -rq "$var" src/ apps/ packages/ 2>/dev/null; then
              echo "- \`$var\` is referenced in code" >> ai-security-report.md
            fi
          done

      - name: Check for AI Security Tests
        id: check-ai-tests
        run: |
          if [ -f "tests/ai/prompt-injection.test.js" ] || [ -f "tests/ai/prompt-injection.test.ts" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Prompt Injection Tests
        if: steps.check-ai-tests.outputs.exists == 'true'
        continue-on-error: true
        run: npm run test:ai-security || echo "AI security tests not available"

      - name: Upload Security Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            npm-audit.json
            trivy-fs-results.json
            trivy-results.sarif
            trufflehog-results.json
            licenses.json
            sbom.json
            ai-security-report.md
          retention-days: 30
          if-no-files-found: warn

  ##############################################################################
  # Job 2 - CodeQL (NON-BLOCKING)
  ##############################################################################
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: codeql-javascript

  ##############################################################################
  # Job 3 - Static Analysis (NON-BLOCKING)
  ##############################################################################
  static-analysis:
    name: Static Analysis (SAST & Code Quality)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        continue-on-error: true
        run: |
          npm run check 2>&1 | tee typecheck-errors.txt || true

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          config: auto
          generateSarif: "1"

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Analysis Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-results
          path: |
            semgrep.sarif
            typecheck-errors.txt
          retention-days: 30
          if-no-files-found: warn

  ##############################################################################
  # Job 4 - Build
  ##############################################################################
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [security-scan]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: |
            apps/api/dist
            packages/shared/dist
          retention-days: 7
          if-no-files-found: warn

  ##############################################################################
  # Job 5 - Testing
  ##############################################################################
  testing:
    name: Unit & API Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Required npm Scripts Exist
        run: |
          for script in test test:api; do
            if ! node -e "process.exit(require('./package.json').scripts?.['$script'] ? 0 : 1)" 2>/dev/null; then
              echo "::warning::package.json is missing script '$script'"
            fi
          done

      - name: Check for Test Script
        id: check-test
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Unit Tests
        if: steps.check-test.outputs.exists == 'true'
        continue-on-error: true
        run: npm test -- --coverage --json --outputFile=test-results.json 2>&1 || true

      - name: Check for API Test Script
        id: check-api-test
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:api'] ? 0 : 1)" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run API Integration Tests
        if: steps.check-api-test.outputs.exists == 'true'
        continue-on-error: true
        run: npm run test:api 2>&1 || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.json
            coverage/
          retention-days: 30
          if-no-files-found: ignore

  ##############################################################################
  # Job 6 - Performance Testing (OPTIONAL - only if tests exist)
  ##############################################################################
  check-performance-tests:
    name: Check for Performance Tests
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      
      - name: Check for Performance Tests
        id: check
        run: |
          if [ -d "tests/performance" ] && [ -n "$(ls -A tests/performance/*.js 2>/dev/null)" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  performance-testing:
    name: Performance & Rate Limiting (k6)
    runs-on: ubuntu-latest
    needs: [testing, check-performance-tests]
    if: needs.check-performance-tests.outputs.exists == 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-dist
          path: .

      - name: Check for Start Script
        id: check-start
        run: |
          if node -e "process.exit(require('./package.json').scripts?.start ? 0 : 1)" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Start API Server
        if: steps.check-start.outputs.exists == 'true'
        continue-on-error: true
        run: |
          npm run start &
          echo $! > server.pid
          sleep 5

      - name: Wait for API Health Check
        if: steps.check-start.outputs.exists == 'true'
        continue-on-error: true
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health 2>/dev/null; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          echo "::warning::API did not become healthy"

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Check for Rate Limit Test
        id: check-rate-limit
        run: |
          if [ -f "tests/performance/rate-limit.js" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Rate Limiting Test
        if: steps.check-rate-limit.outputs.exists == 'true'
        continue-on-error: true
        run: k6 run tests/performance/rate-limit.js --out json=rate-limit-results.json 2>&1 || true

      - name: Check for Load Test
        id: check-load-test
        run: |
          if [ -f "tests/performance/load-test.js" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Load Test
        if: steps.check-load-test.outputs.exists == 'true'
        continue-on-error: true
        run: k6 run tests/performance/load-test.js --out json=load-test-results.json 2>&1 || true

      - name: Cleanup
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi

      - name: Upload Performance Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            rate-limit-results.json
            load-test-results.json
            tests/performance/reports
          retention-days: 30
          if-no-files-found: ignore

  ##############################################################################
  # Job 7 - Generate Security Report
  ##############################################################################
  generate-security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [security-scan, codeql, static-analysis, testing]
    if: always()
    permissions:
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Install Report Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Parse Trivy Results
        id: trivy-parse
        continue-on-error: true
        run: |
          TRIVY_FILE="artifacts/security-scan-results/trivy-fs-results.json"
          
          if [ -f "$TRIVY_FILE" ]; then
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$TRIVY_FILE" 2>/dev/null || echo "0")
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "$TRIVY_FILE" 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' "$TRIVY_FILE" 2>/dev/null || echo "0")
            LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' "$TRIVY_FILE" 2>/dev/null || echo "0")
          else
            CRITICAL=0
            HIGH=0
            MEDIUM=0
            LOW=0
          fi
          
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT
          echo "low=$LOW" >> $GITHUB_OUTPUT
          echo "total=$((CRITICAL + HIGH + MEDIUM + LOW))" >> $GITHUB_OUTPUT

      - name: Parse npm Audit Results
        id: npm-parse
        continue-on-error: true
        run: |
          NPM_FILE="artifacts/security-scan-results/npm-audit.json"
          
          if [ -f "$NPM_FILE" ]; then
            NPM_CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' "$NPM_FILE" 2>/dev/null || echo "0")
            NPM_HIGH=$(jq '.metadata.vulnerabilities.high // 0' "$NPM_FILE" 2>/dev/null || echo "0")
            NPM_TOTAL=$(jq '.metadata.vulnerabilities.total // 0' "$NPM_FILE" 2>/dev/null || echo "0")
          else
            NPM_CRITICAL=0
            NPM_HIGH=0
            NPM_TOTAL=0
          fi
          
          echo "critical=$NPM_CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$NPM_HIGH" >> $GITHUB_OUTPUT
          echo "total=$NPM_TOTAL" >> $GITHUB_OUTPUT

      - name: Generate HTML Report
        run: |
          mkdir -p reports
          
          cat > reports/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Security Report - ${{ github.repository }}</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { 
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                padding: 20px;
                min-height: 100vh;
              }
              .container { 
                max-width: 1200px; 
                margin: 0 auto; 
                background: white; 
                padding: 40px; 
                border-radius: 12px; 
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
              }
              h1 { 
                color: #1a202c; 
                border-bottom: 4px solid #667eea; 
                padding-bottom: 15px; 
                margin-bottom: 10px;
                font-size: 2.5em;
              }
              .timestamp { 
                color: #718096; 
                font-size: 14px; 
                margin-bottom: 30px;
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
              }
              .timestamp span {
                background: #f7fafc;
                padding: 5px 12px;
                border-radius: 4px;
                border: 1px solid #e2e8f0;
              }
              .summary { 
                display: grid; 
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
                gap: 20px; 
                margin: 30px 0; 
              }
              .card { 
                background: linear-gradient(135deg, #f6f8fb 0%, #ffffff 100%);
                padding: 25px; 
                border-radius: 8px; 
                border-left: 5px solid #667eea;
                box-shadow: 0 2px 8px rgba(0,0,0,0.05);
                transition: transform 0.2s, box-shadow 0.2s;
              }
              .card:hover {
                transform: translateY(-3px);
                box-shadow: 0 4px 16px rgba(0,0,0,0.1);
              }
              .card-title {
                font-size: 14px;
                color: #4a5568;
                margin-bottom: 10px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.5px;
              }
              .critical { border-left-color: #f56565; }
              .high { border-left-color: #ed8936; }
              .medium { border-left-color: #ecc94b; }
              .low { border-left-color: #48bb78; }
              .metric { 
                font-size: 42px; 
                font-weight: bold; 
                color: #2d3748;
                line-height: 1;
              }
              h2 { 
                color: #2d3748; 
                margin: 40px 0 20px 0; 
                font-size: 1.8em;
                border-bottom: 2px solid #e2e8f0;
                padding-bottom: 10px;
              }
              table { 
                width: 100%; 
                border-collapse: collapse; 
                margin: 20px 0;
                background: white;
                border-radius: 8px;
                overflow: hidden;
                box-shadow: 0 2px 8px rgba(0,0,0,0.05);
              }
              th, td { 
                padding: 16px; 
                text-align: left; 
                border-bottom: 1px solid #e2e8f0; 
              }
              th { 
                background: #f7fafc; 
                font-weight: 600;
                color: #2d3748;
                text-transform: uppercase;
                font-size: 12px;
                letter-spacing: 0.5px;
              }
              tr:hover {
                background: #f7fafc;
              }
              a { 
                color: #667eea; 
                text-decoration: none;
                font-weight: 500;
                transition: color 0.2s;
              }
              a:hover { 
                color: #764ba2;
                text-decoration: underline;
              }
              .footer {
                margin-top: 50px;
                padding-top: 30px;
                border-top: 2px solid #e2e8f0;
                text-align: center;
                color: #718096;
                font-size: 14px;
              }
              .scan-status {
                display: inline-flex;
                align-items: center;
                gap: 5px;
              }
              .status-icon {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #48bb78;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🛡️ Security Scan Report</h1>
              
              <div class="timestamp">
                <span>📅 <strong>Generated:</strong> $(date -u +"%Y-%m-%d %H:%M:%S UTC")</span>
                <span>🔖 <strong>Commit:</strong> <code>${{ github.sha }}</code></span>
                <span>🌿 <strong>Branch:</strong> <code>${{ github.ref_name }}</code></span>
              </div>
              
              <div class="summary">
                <div class="card critical">
                  <div class="card-title">Critical Issues</div>
                  <div class="metric">${{ steps.trivy-parse.outputs.critical }}</div>
                </div>
                <div class="card high">
                  <div class="card-title">High Severity</div>
                  <div class="metric">${{ steps.trivy-parse.outputs.high }}</div>
                </div>
                <div class="card medium">
                  <div class="card-title">Medium Severity</div>
                  <div class="metric">${{ steps.trivy-parse.outputs.medium }}</div>
                </div>
                <div class="card low">
                  <div class="card-title">Low Severity</div>
                  <div class="metric">${{ steps.trivy-parse.outputs.low }}</div>
                </div>
              </div>

              <h2>📊 Scan Summary</h2>
              <table>
                <thead>
                  <tr>
                    <th>Scanner</th>
                    <th>Status</th>
                    <th>Findings</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td><strong>Trivy (SCA)</strong></td>
                    <td><span class="scan-status"><span class="status-icon"></span> Completed</span></td>
                    <td>${{ steps.trivy-parse.outputs.total }} vulnerabilities</td>
                  </tr>
                  <tr>
                    <td><strong>npm audit</strong></td>
                    <td><span class="scan-status"><span class="status-icon"></span> Completed</span></td>
                    <td>${{ steps.npm-parse.outputs.total }} vulnerabilities</td>
                  </tr>
                  <tr>
                    <td><strong>Gitleaks</strong></td>
                    <td><span class="scan-status"><span class="status-icon"></span> Completed</span></td>
                    <td>Secret scanning</td>
                  </tr>
                  <tr>
                    <td><strong>TruffleHog</strong></td>
                    <td><span class="scan-status"><span class="status-icon"></span> Completed</span></td>
                    <td>Secret scanning</td>
                  </tr>
                  <tr>
                    <td><strong>Semgrep (SAST)</strong></td>
                    <td><span class="scan-status"><span class="status-icon"></span> Completed</span></td>
                    <td>Static analysis</td>
                  </tr>
                  <tr>
                    <td><strong>CodeQL</strong></td>
                    <td><span class="scan-status"><span class="status-icon"></span> Completed</span></td>
                    <td><a href="${{ github.server_url }}/${{ github.repository }}/security/code-scanning" target="_blank">View Results →</a></td>
                  </tr>
                </tbody>
              </table>

              <h2>📦 Supply Chain Security</h2>
              <table>
                <tbody>
                  <tr>
                    <td><strong>SBOM (Software Bill of Materials)</strong></td>
                    <td>CycloneDX format generated</td>
                  </tr>
                  <tr>
                    <td><strong>License Compliance</strong></td>
                    <td>Automated license checking</td>
                  </tr>
                </tbody>
              </table>

              <h2>🤖 AI Security</h2>
              <table>
                <tbody>
                  <tr>
                    <td><strong>API Key Scanning</strong></td>
                    <td>Pattern-based detection</td>
                  </tr>
                  <tr>
                    <td><strong>Prompt Injection Tests</strong></td>
                    <td>Automated validation</td>
                  </tr>
                </tbody>
              </table>

              <h2>🔗 Resources</h2>
              <ul style="list-style: none; padding: 0;">
                <li style="padding: 10px 0;">
                  🔍 <a href="${{ github.server_url }}/${{ github.repository }}/security" target="_blank">GitHub Security Overview</a>
                </li>
                <li style="padding: 10px 0;">
                  📊 <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" target="_blank">View Workflow Run</a>
                </li>
                <li style="padding: 10px 0;">
                  📋 <a href="${{ github.server_url }}/${{ github.repository }}/tree/reports" target="_blank">Historical Reports</a>
                </li>
              </ul>

              <div class="footer">
                <p><strong>DevSecOps Pipeline</strong> - Automated Security Scanning</p>
                <p style="margin-top: 10px;">✅ This is an informational report. No deployment gates were applied.</p>
                <p style="margin-top: 5px; font-size: 12px;">Generated by GitHub Actions</p>
              </div>
            </div>
          </body>
          </html>
          HTMLEOF

      - name: Generate Markdown Summary
        run: |
          cat > reports/SECURITY-SUMMARY.md <<'MDEOF'
          # 🛡️ Security Scan Summary
          
          **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")  
          **Commit**: `${{ github.sha }}`  
          **Branch**: `${{ github.ref_name }}`  
          **Workflow**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ## 📊 Vulnerability Overview
          
          | Severity | Count |
          |----------|-------|
          | 🔴 Critical | ${{ steps.trivy-parse.outputs.critical }} |
          | 🟠 High | ${{ steps.trivy-parse.outputs.high }} |
          | 🟡 Medium | ${{ steps.trivy-parse.outputs.medium }} |
          | 🟢 Low | ${{ steps.trivy-parse.outputs.low }} |
          | **Total** | **${{ steps.trivy-parse.outputs.total }}** |
          
          ## 🔍 Scan Results
          
          | Scanner | Status | Findings |
          |---------|--------|----------|
          | Trivy (SCA) | ✅ Complete | ${{ steps.trivy-parse.outputs.total }} vulnerabilities |
          | npm audit | ✅ Complete | ${{ steps.npm-parse.outputs.total }} vulnerabilities |
          | Gitleaks | ✅ Complete | Secret scanning |
          | TruffleHog | ✅ Complete | Secret scanning |
          | Semgrep | ✅ Complete | Static analysis |
          | CodeQL | ✅ Complete | Code scanning |
          
          ## 🔗 Quick Links
          
          - [🔒 GitHub Security Tab](${{ github.server_url }}/${{ github.repository }}/security)
          - [📊 Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - [📋 Reports Branch](https://github.com/${{ github.repository }}/tree/reports)
          
          ## 📝 Recommended Actions
          
          1. Review critical and high severity vulnerabilities
          2. Update dependencies: `npm audit fix`
          3. Check for outdated packages: `npm outdated`
          4. Review AI security findings
          
          ---
          
          *Generated by DevSecOps Pipeline*
          MDEOF

      - name: Create Detailed Vulnerability Report
        if: steps.trivy-parse.outputs.critical > 0 || steps.trivy-parse.outputs.high > 0
        run: |
          TRIVY_FILE="artifacts/security-scan-results/trivy-fs-results.json"
          
          if [ -f "$TRIVY_FILE" ]; then
            cat > reports/VULNERABILITIES.md <<'VULNEOF'
          # 🚨 Critical & High Severity Vulnerabilities
          
          **Scan Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          VULNEOF
            
            jq -r '.Results[]? | select(.Vulnerabilities != null) | .Vulnerabilities[] | select(.Severity == "CRITICAL" or .Severity == "HIGH") | 
            "## \(.VulnerabilityID) (\(.Severity))\n\n" +
            "**Package**: `\(.PkgName)@\(.InstalledVersion)`\n" +
            "**Fixed Version**: \(.FixedVersion // "No fix available")\n" +
            "**CVSS Score**: \(.CVSS.nvd.V3Score // "N/A")\n\n" +
            "### Description\n\n\(.Description // "No description available")\n\n" +
            "### References\n\n" +
            (\(.References // [] | map("- " + .) | join("\n")) // "No references available") +
            "\n\n---\n"
            ' "$TRIVY_FILE" >> reports/VULNERABILITIES.md 2>/dev/null || echo "No critical/high vulnerabilities found" >> reports/VULNERABILITIES.md
          fi

      - name: Copy Artifacts to Reports
        run: |
          mkdir -p reports/artifacts
          cp -r artifacts/* reports/artifacts/ 2>/dev/null || true

      - name: Commit Reports to Repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Try to checkout reports branch
          git fetch origin reports 2>/dev/null || true
          git checkout reports 2>/dev/null || git checkout --orphan reports
          
          # Clean the branch
          git rm -rf . 2>/dev/null || true
          
          # Create directory structure
          REPORT_DIR="security-reports/$(date +%Y-%m-%d-%H%M%S)"
          mkdir -p "$REPORT_DIR"
          
          # Copy reports
          cp -r reports/* "$REPORT_DIR/" 2>/dev/null || true
          cp reports/SECURITY-SUMMARY.md README.md 2>/dev/null || true
          
          # Create index
          cat > index.md <<'INDEXEOF'
          # Security Reports Archive
          
          This branch contains historical security scan reports.
          
          ## Latest Report
          
          [View Latest Report](./README.md)
          
          ## Recent Reports
          
          INDEXEOF
          
          ls -dt security-reports/*/ 2>/dev/null | head -10 | while read dir; do
            date=$(basename "$dir")
            echo "- [$date](./$dir/SECURITY-SUMMARY.md)" >> index.md
          done
          
          git add .
          git commit -m "Security report for commit ${{ github.sha }}" || echo "No changes to commit"
          git push origin reports || echo "Failed to push reports branch"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create/Update GitHub Issue for Critical Findings
        if: github.ref == 'refs/heads/main' && (steps.trivy-parse.outputs.critical > 0 || steps.trivy-parse.outputs.high > 0)
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            
            const critical = ${{ steps.trivy-parse.outputs.critical }};
            const high = ${{ steps.trivy-parse.outputs.high }};
            const total = critical + high;
            
            if (total === 0) {
              console.log('No critical or high vulnerabilities found');
              return;
            }
            
            // Read Trivy results
            let vulnerabilities = [];
            try {
              const triviaResults = JSON.parse(fs.readFileSync('artifacts/security-scan-results/trivy-fs-results.json', 'utf8'));
              
              (triviaResults.Results || []).forEach(result => {
                (result.Vulnerabilities || []).forEach(vuln => {
                  if (vuln.Severity === 'CRITICAL' || vuln.Severity === 'HIGH') {
                    vulnerabilities.push(vuln);
                  }
                });
              });
            } catch (e) {
              console.log('Error reading Trivy results:', e);
            }
            
            // Create issue body
            const issueBody = `## 🚨 Security Vulnerabilities Detected
            
            **Scan Date**: ${new Date().toISOString()}  
            **Commit**: \`${context.sha}\`  
            **Branch**: \`${context.ref}\`
            
            ### Summary
            
            | Severity | Count |
            |----------|-------|
            | 🔴 Critical | ${critical} |
            | 🟠 High | ${high} |
            | **Total** | **${total}** |
            
            ### Top Vulnerabilities
            
            ${vulnerabilities.slice(0, 5).map(v => `
            #### ${v.VulnerabilityID} (${v.Severity})
            - **Package**: \`${v.PkgName}@${v.InstalledVersion}\`
            - **Fixed in**: ${v.FixedVersion || 'No fix available'}
            - **CVSS**: ${v.CVSS?.nvd?.V3Score || 'N/A'}
            - **Description**: ${v.Title || v.Description?.substring(0, 200) || 'N/A'}
            `).join('\n')}
            
            ${vulnerabilities.length > 5 ? `\n*...and ${vulnerabilities.length - 5} more vulnerabilities.*\n` : ''}
            
            ### 🔗 Resources
            
            - [🔍 Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            - [🔒 GitHub Security Tab](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/security)
            
            ### ✅ Recommended Actions
            
            \`\`\`bash
            # Check for vulnerabilities
            npm audit
            
            # Fix vulnerabilities
            npm audit fix
            
            # Update packages
            npm update
            \`\`\`
            
            ---
            
            *🤖 Auto-generated by DevSecOps Pipeline*`;
            
            // Check for existing issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated'
            });
            
            const existingIssue = issues.data.find(i => 
              i.title.includes('Security Vulnerabilities Detected')
            );
            
            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: issueBody
              });
              console.log(`Updated issue #${existingIssue.number}`);
            } else {
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Security Vulnerabilities - ${critical} Critical, ${high} High`,
                body: issueBody,
                labels: ['security', 'automated', 'vulnerability']
              });
              console.log(`Created issue #${newIssue.data.number}`);
            }

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            
            let summary = '';
            try {
              summary = fs.readFileSync('reports/SECURITY-SUMMARY.md', 'utf8');
            } catch (e) {
              summary = '## Security Scan Complete\n\nSee workflow run for details.';
            }
            
            const critical = ${{ steps.trivy-parse.outputs.critical }};
            const high = ${{ steps.trivy-parse.outputs.high }};
            
            let status = '✅ No critical issues found';
            if (critical > 0) {
              status = `⚠️ ${critical} critical vulnerabilities detected`;
            } else if (high > 0) {
              status = `⚠️ ${high} high severity vulnerabilities detected`;
            }
            
            const comment = `${summary}
            
            ---
            
            **Status**: ${status}
            
            [Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Generate Job Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<'SUMMARYEOF'
          # 📊 Security Report Generated
          
          ## Summary
          
          | Severity | Count |
          |----------|-------|
          | 🔴 Critical | ${{ steps.trivy-parse.outputs.critical }} |
          | 🟠 High | ${{ steps.trivy-parse.outputs.high }} |
          | 🟡 Medium | ${{ steps.trivy-parse.outputs.medium }} |
          | 🟢 Low | ${{ steps.trivy-parse.outputs.low }} |
          
          ## 🔗 Quick Access
          
          - **🔒 [GitHub Security](https://github.com/${{ github.repository }}/security)**
          - **📋 [Reports Branch](https://github.com/${{ github.repository }}/tree/reports)**
          - **📊 [Workflow Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**
          
          ## 📦 Artifacts
          
          - Security scan results (30 days)
          - Static analysis results (30 days)
          - Test results (30 days)
          - SBOM & License reports (30 days)
          
          ---
          
          *✅ Pipeline completed successfully - No blocking gates applied*
          SUMMARYEOF
