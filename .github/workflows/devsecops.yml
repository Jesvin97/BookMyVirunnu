name: DevSecOps

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Job 1: Secrets Scanning & SCA (Software Composition Analysis)
  security-scan:
    name: Secrets & Dependency Auditing (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Dependency Vulnerability Audit (SCA)
        run: npm audit --workspaces --audit-level=high

      - name: Secrets Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2

      - name: Filesystem Security Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  # Job 2: Typecheck and Build (SAST & Quality)
  build:
    name: Build & Type Check (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type Check Workspaces
        run: npm run check

      - name: Compile and Build Apps
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: |
            apps/api/dist
            packages/shared/dist
          retention-days: 1

  # Job 3: API Integration Testing (DAST)
  api-testing:
    name: API Dynamic Integration Testing
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist

      - name: Run Dynamic API Smoke Tests
        run: npm run test:api
